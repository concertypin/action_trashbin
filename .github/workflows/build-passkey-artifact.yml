name: Build Firefox personal-use artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Firefox (${{ matrix.mode }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: none
            display_name: Bitwarden Passkeyize (None Attestation)
            version: 2026.9.26.1
          - mode: packed-untrusted-x5c
            display_name: Bitwarden Passkeyize (Packed Attestation)
            version: 2026.9.26.2
    env:
      BROWSER: firefox
      BW_ROAMING_ATTESTATION_MODE: ${{ matrix.mode }}
      MANIFEST_VERSION: "3"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=4608
      npm_config_node_options: --max-old-space-size=4608
    steps:
      - name: Check out build harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false

      - name: Check out Bitwarden source base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bitwarden/clients
          ref: b3cedf86adfaed4388ef15b8d92cf8a7cfc7eefa
          path: clients
          persist-credentials: false
          fetch-depth: 1

      - name: Apply passkey profile changes
        working-directory: clients
        run: git apply --whitespace=nowarn ../harness/clients.patch

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: clients/.nvmrc

      - name: Set up pnpm
        working-directory: clients
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm --version

      - name: Install dependencies
        working-directory: clients
        run: pnpm install --frozen-lockfile

      - name: Link workspace packages for webpack aliases
        working-directory: clients
        run: |
          while IFS= read -r -d '' manifest; do
            package_name=$(jq -r '.name // empty' "$manifest")
            case "$package_name" in
              @bitwarden/*)
                package_path=${manifest%/package.json}
                package_link="node_modules/$package_name"
                mkdir -p "$(dirname "$package_link")"
                rm -rf "$package_link"
                ln -s "$GITHUB_WORKSPACE/clients/$package_path" "$package_link"
                ;;
            esac
          done < <(find apps libs -name node_modules -prune -o -name package.json -print0)

      - name: Build Firefox production extension
        working-directory: clients
        run: pnpm --filter @bitwarden/browser exec webpack --output-path=../../dist/apps/browser/firefox-${{ matrix.mode }}

      - name: Stamp personal build identity
        working-directory: clients
        env:
          PERSONAL_BUILD_NAME: ${{ matrix.display_name }}
          PERSONAL_BUILD_VERSION: ${{ matrix.version }}
        run: |
          manifest=dist/apps/browser/firefox-${{ matrix.mode }}/manifest.json
          jq --arg name "$PERSONAL_BUILD_NAME" --arg version "$PERSONAL_BUILD_VERSION" \
            '.name = $name | .version = $version' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passkey-profile-firefox-${{ matrix.mode }}
          path: clients/dist/apps/browser/firefox-${{ matrix.mode }}/
          if-no-files-found: error
          retention-days: 7
